<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>My Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-dim: #888;
    --text-dimmer: #444;
    --accent: #4a9eff;
    --accent-dim: rgba(74,158,255,0.15);
    --danger: #ff4a4a;
    --radius: 12px;
    --nav-height: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
  .screen.active { display: flex; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: calc(var(--nav-height) + 16px);
    -webkit-overflow-scrolling: touch;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title {
    font-size: 26px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px;
    border: none; background: var(--surface2);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: background 0.15s, transform 0.1s;
  }
  .icon-btn:active { transform: scale(0.9); background: var(--border); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ── DATE GROUPS ── */
  .date-group { padding: 0 4px; margin-bottom: 8px; }
  .date-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    padding: 10px 16px 6px;
    letter-spacing: 0.3px;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .photo-thumb {
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    background: var(--surface);
  }
  .photo-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .photo-thumb:active img { transform: scale(0.96); }

  /* long press select indicator */
  .photo-thumb.selected::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(74,158,255,0.35);
    border: 2px solid var(--accent);
  }
  .photo-thumb .check {
    display: none;
    position: absolute;
    top: 6px; right: 6px;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    align-items: center; justify-content: center;
  }
  .photo-thumb.selected .check { display: flex; }

  /* ── ALBUMS GRID ── */
  .albums-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 8px 16px;
  }
  .album-card {
    cursor: pointer;
    transition: transform 0.15s;
  }
  .album-card:active { transform: scale(0.95); }
  .album-cover {
    aspect-ratio: 1;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .album-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album-cover-empty { color: var(--text-dimmer); }
  .album-cover-empty svg { width: 32px; height: 32px; }
  .album-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .album-count { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--nav-height);
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 8px 0;
    color: var(--text-dim);
    transition: color 0.15s;
    border: none;
    background: none;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-label { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 32px;
    text-align: center;
    gap: 12px;
  }
  .empty-state svg { width: 56px; height: 56px; color: var(--text-dimmer); }
  .empty-state h3 { font-size: 18px; font-weight: 500; color: var(--text-dim); }
  .empty-state p { font-size: 13px; color: var(--text-dimmer); line-height: 1.5; }

  /* ── UPLOAD SCREEN ── */
  #screen-upload .scroll-area {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
  }
  .upload-box {
    width: 220px; height: 220px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .upload-box:hover, .upload-box.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .upload-box input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-box svg { width: 40px; height: 40px; color: var(--text-dimmer); }
  .upload-box span { font-size: 13px; color: var(--text-dim); text-align: center; padding: 0 16px; }

  .album-picker-label { font-size: 13px; color: var(--text-dim); align-self: flex-start; padding-left: 32px; }
  .album-picker-wrap { width: calc(100% - 64px); }
  select.album-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .upload-preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: calc(100% - 64px);
    max-height: 300px;
    overflow-y: auto;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .upload-preview-item {
    aspect-ratio: 1;
    background: var(--surface2);
    overflow: hidden;
    position: relative;
  }
  .upload-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .upload-preview-item .remove-preview {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px;
    background: rgba(0,0,0,0.7);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; color: #fff;
    font-size: 12px; line-height: 1;
  }

  .upload-btn {
    width: calc(100% - 64px);
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .upload-btn:active { transform: scale(0.98); opacity: 0.85; }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 24px 40px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.2s ease;
    border-top: 1px solid var(--border);
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 8px;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary {
    flex: 1; padding: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:active { background: var(--border); }
  .btn-primary {
    flex: 1; padding: 13px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-danger {
    flex: 1; padding: 13px;
    background: rgba(255,74,74,0.15);
    border: 1px solid rgba(255,74,74,0.3);
    border-radius: var(--radius);
    color: var(--danger);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
  }

  /* ── ALBUM DETAIL SCREEN ── */
  .album-detail-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 12px;
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .back-btn {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: none; border-radius: 50%;
    cursor: pointer; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .back-btn:active { background: var(--border); }
  .album-detail-title { font-size: 20px; font-weight: 600; flex: 1; }
  .album-detail-count { font-size: 13px; color: var(--text-dim); }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    z-index: 150;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox-topbar {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: rgba(0,0,0,0.5);
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 1;
  }
  .lightbox-img-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .lightbox-img-wrap img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    user-select: none;
  }
  .lightbox-actions {
    display: flex; gap: 12px;
    padding: 16px 20px;
    background: rgba(0,0,0,0.5);
    justify-content: center;
  }
  .lightbox-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .lightbox-btn.danger { border-color: rgba(255,74,74,0.4); color: var(--danger); background: rgba(255,74,74,0.08); }

  /* ── CONTEXT MENU ── */
  .context-menu {
    display: none;
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    z-index: 400;
    min-width: 160px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .context-menu.open { display: block; }
  .context-item {
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.1s;
    border: none; background: none; color: var(--text);
    width: 100%; text-align: left;
    font-family: 'DM Sans', sans-serif;
  }
  .context-item:hover { background: var(--surface2); }
  .context-item.danger { color: var(--danger); }
  .context-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(var(--nav-height) + 12px); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--text);
    z-index: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── SEARCH BAR ── */
  .search-bar {
    padding: 0 16px 10px;
    display: flex; gap: 8px;
  }
  .search-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dimmer); }

  /* Loading */
  .loading-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 600;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- PICTURES SCREEN -->
<div class="screen active" id="screen-pictures">
  <div class="topbar">
    <span class="topbar-title">Pictures</span>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="showScreen('upload')" title="Upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="search-bar">
    <input class="search-input" id="pictures-search" placeholder="Search photos..." oninput="renderPictures()">
  </div>
  <div class="scroll-area" id="pictures-scroll">
    <div id="pictures-content"></div>
  </div>
</div>

<!-- ALBUMS SCREEN -->
<div class="screen" id="screen-albums">
  <div class="topbar">
    <span class="topbar-title">Albums</span>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="openCreateAlbumModal()" title="New Album">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="scroll-area">
    <div class="albums-grid" id="albums-grid"></div>
  </div>
</div>

<!-- ALBUM DETAIL SCREEN -->
<div class="screen" id="screen-album-detail">
  <div class="album-detail-topbar">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="album-detail-title" id="album-detail-title">Album</span>
    <span class="album-detail-count" id="album-detail-count"></span>
    <button class="icon-btn" id="album-edit-btn" title="Edit Album">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </div>
  <div class="scroll-area">
    <div class="photo-grid" id="album-detail-grid"></div>
  </div>
</div>

<!-- UPLOAD SCREEN -->
<div class="screen" id="screen-upload">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="topbar-title">Upload Photos</span>
  </div>
  <div class="scroll-area" style="display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:32px;">
    <div class="upload-box" id="upload-box">
      <input type="file" id="file-input" multiple accept="image/*" onchange="handleFileSelect(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Tap to select photos<br><span style="font-size:11px;color:var(--text-dimmer)">or drag & drop</span></span>
    </div>

    <div class="album-picker-wrap">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">Add to album (optional)</div>
      <select class="album-select" id="upload-album-select">
        <option value="">No album</option>
      </select>
    </div>

    <div class="upload-preview-grid" id="upload-preview" style="display:none;"></div>

    <button class="upload-btn" id="upload-btn" onclick="uploadPhotos()" disabled>
      Save Photos
    </button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-pictures" onclick="showScreen('pictures')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span class="nav-label">Pictures</span>
  </button>
  <button class="nav-item" id="nav-albums" onclick="showScreen('albums')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="7" width="20" height="15" rx="2"/>
      <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
    </svg>
    <span class="nav-label">Albums</span>
  </button>
</nav>

<!-- MODALS -->
<!-- Create/Edit Album -->
<div class="modal-overlay" id="modal-album">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-album-title">Create Album</div>
    <input class="modal-input" id="album-name-input" placeholder="Album name" maxlength="50">
    <input class="modal-input" id="album-order-input" type="number" placeholder="Sort order (0 = first)" min="0" style="margin-top:8px;">
    <div style="font-size:11px;color:var(--text-dimmer);padding:0 4px;">Lower number shows first in Albums</div>
    <div class="modal-actions" id="modal-album-actions">
      <button class="btn-secondary" onclick="closeModal('modal-album')">Cancel</button>
      <button class="btn-primary" id="modal-album-confirm" onclick="confirmAlbum()">Create</button>
    </div>
  </div>
</div>

<!-- Album Options (edit/delete from detail) -->
<div class="modal-overlay" id="modal-album-options">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="album-options-name">Album</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn-secondary" onclick="editCurrentAlbum()" style="text-align:left;padding:14px 16px;">
        ✏️ &nbsp; Rename album
      </button>
      <button class="btn-secondary" onclick="deleteCurrentAlbum()" style="text-align:left;padding:14px 16px;color:var(--danger);border-color:rgba(255,74,74,0.3);">
        🗑️ &nbsp; Delete album
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-album-options')">Cancel</button>
    </div>
  </div>
</div>

<!-- Photo Options -->
<div class="modal-overlay" id="modal-photo-options">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Photo Options</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn-secondary" onclick="movePhotoToAlbum()" style="text-align:left;padding:14px 16px;">
        📁 &nbsp; Move to album
      </button>
      <button class="btn-secondary" onclick="deleteCurrentPhoto()" style="text-align:left;padding:14px 16px;color:var(--danger);border-color:rgba(255,74,74,0.3);">
        🗑️ &nbsp; Delete photo
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-photo-options')">Cancel</button>
    </div>
  </div>
</div>

<!-- Move to Album picker -->
<div class="modal-overlay" id="modal-move-album">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Move to Album</div>
    <div id="move-album-list" style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-move-album')">Cancel</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-topbar">
    <button class="back-btn" onclick="closeLightbox()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="lightbox-label" style="font-size:13px;color:var(--text-dim);"></span>
    <button class="icon-btn" onclick="openPhotoOptions()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </div>
  <div class="lightbox-img-wrap">
    <img id="lightbox-img" src="" alt="">
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <span style="font-size:13px;color:var(--text-dim);">Saving...</span>
</div>

<script>
// ══════════════════════════════════════════
//  DATABASE
// ══════════════════════════════════════════
let db;
const DB_NAME = 'MyGalleryDB';
const DB_VERSION = 1;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) {
        const ps = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('albumId', 'albumId', { unique: false });
        ps.createIndex('date', 'date', { unique: false });
      }
      if (!d.objectStoreNames.contains('albums')) {
        d.createObjectStore('albums', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbAdd(store, data) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add(data);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbPut(store, data) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let currentScreen = 'pictures';
let prevScreen = null;
let currentAlbumId = null;
let currentPhotoId = null;
let pendingFiles = [];
let editingAlbumId = null;

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function showScreen(name, albumId = null) {
  if (name !== 'album-detail' && name !== 'upload') prevScreen = currentScreen;
  currentScreen = name;

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');

  // update nav highlight
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (name === 'pictures') document.getElementById('nav-pictures').classList.add('active');
  if (name === 'albums') document.getElementById('nav-albums').classList.add('active');

  // hide nav on sub-screens
  const hideNav = ['album-detail', 'upload'];
  document.querySelector('.bottom-nav').style.display = hideNav.includes(name) ? 'none' : '';

  if (name === 'pictures') renderPictures();
  if (name === 'albums') renderAlbums();
  if (name === 'upload') renderUploadAlbumPicker();
  if (name === 'album-detail' && albumId !== null) openAlbum(albumId);
}

function goBack() {
  showScreen(prevScreen || 'pictures');
}

// ══════════════════════════════════════════
//  PICTURES SCREEN
// ══════════════════════════════════════════
async function renderPictures() {
  const photos = await dbGetAll('photos');
  const query = document.getElementById('pictures-search').value.toLowerCase();

  const filtered = query
    ? photos.filter(p => (p.name || '').toLowerCase().includes(query) || (p.albumName || '').toLowerCase().includes(query))
    : photos;

  const container = document.getElementById('pictures-content');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <h3>${query ? 'No results' : 'No photos yet'}</h3>
      <p>${query ? 'Try a different search.' : 'Tap + to upload your first photo.'}</p>
    </div>`;
    return;
  }

  // group by date
  const groups = {};
  filtered.sort((a,b) => b.date - a.date).forEach(p => {
    const label = formatDateLabel(p.date);
    if (!groups[label]) groups[label] = [];
    groups[label].push(p);
  });

  container.innerHTML = Object.entries(groups).map(([label, photos]) => `
    <div class="date-group">
      <div class="date-label">${label}</div>
      <div class="photo-grid">
        ${photos.map(p => `
          <div class="photo-thumb" data-id="${p.id}" onclick="openLightbox(${p.id})">
            <img src="${p.dataUrl}" alt="${p.name || ''}">
            <div class="check"><svg viewBox="0 0 24 24" fill="white" width="12" height="12"><polyline points="20 6 9 17 4 12" stroke="white" stroke-width="2.5" fill="none"/></svg></div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function formatDateLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  const day = 86400000;
  if (diff < day && d.getDate() === now.getDate()) return 'Today';
  if (diff < 2 * day) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

// ══════════════════════════════════════════
//  ALBUMS SCREEN
// ══════════════════════════════════════════
async function renderAlbums() {
  const albums = await dbGetAll('albums');
  albums.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
  const photos = await dbGetAll('photos');
  const grid = document.getElementById('albums-grid');

  if (albums.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      <h3>No albums yet</h3>
      <p>Tap + to create your first album.</p>
    </div>`;
    return;
  }

  grid.innerHTML = albums.map(album => {
    const albumPhotos = photos.filter(p => p.albumId === album.id);
    const cover = albumPhotos[albumPhotos.length - 1];
    return `
      <div class="album-card" onclick="showScreen('album-detail', ${album.id})">
        <div class="album-cover">
          ${cover ? `<img src="${cover.dataUrl}" alt="">` : `<div class="album-cover-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
        </div>
        <div class="album-name">${album.name}</div>
        <div class="album-count">${albumPhotos.length}</div>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════
//  ALBUM DETAIL
// ══════════════════════════════════════════
async function openAlbum(albumId) {
  currentAlbumId = albumId;
  const album = await dbGet('albums', albumId);
  const photos = await dbGetAll('photos');
  const albumPhotos = photos.filter(p => p.albumId === albumId).sort((a,b) => b.date - a.date);

  document.getElementById('album-detail-title').textContent = album.name;
  document.getElementById('album-detail-count').textContent = `${albumPhotos.length} photo${albumPhotos.length !== 1 ? 's' : ''}`;

  document.getElementById('album-edit-btn').onclick = () => {
    document.getElementById('album-options-name').textContent = album.name;
    openModal('modal-album-options');
  };

  const grid = document.getElementById('album-detail-grid');
  if (albumPhotos.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <h3>No photos</h3>
      <p>Upload photos and assign them to this album.</p>
    </div>`;
    return;
  }

  grid.innerHTML = albumPhotos.map(p => `
    <div class="photo-thumb" onclick="openLightbox(${p.id}, true)">
      <img src="${p.dataUrl}" alt="">
    </div>
  `).join('');
}

// ══════════════════════════════════════════
//  CREATE / EDIT ALBUM
// ══════════════════════════════════════════
function openCreateAlbumModal() {
  editingAlbumId = null;
  document.getElementById('modal-album-title').textContent = 'Create Album';
  document.getElementById('modal-album-confirm').textContent = 'Create';
  document.getElementById('album-name-input').value = '';
  document.getElementById('album-order-input').value = '';
  openModal('modal-album');
  setTimeout(() => document.getElementById('album-name-input').focus(), 200);
}

async function editCurrentAlbum() {
  closeModal('modal-album-options');
  const album = await dbGet('albums', currentAlbumId);
  editingAlbumId = currentAlbumId;
  document.getElementById('modal-album-title').textContent = 'Rename Album';
  document.getElementById('modal-album-confirm').textContent = 'Save';
  document.getElementById('album-name-input').value = album.name;
  document.getElementById('album-order-input').value = album.order ?? '';
  openModal('modal-album');
  setTimeout(() => document.getElementById('album-name-input').focus(), 200);
}

async function confirmAlbum() {
  const name = document.getElementById('album-name-input').value.trim();
  if (!name) { showToast('Enter an album name'); return; }
  const orderVal = document.getElementById('album-order-input').value;
  const order = orderVal !== '' ? parseInt(orderVal) : 999;

  if (editingAlbumId) {
    const album = await dbGet('albums', editingAlbumId);
    album.name = name;
    album.order = order;
    await dbPut('albums', album);
    const photos = await dbGetAll('photos');
    for (const p of photos.filter(p => p.albumId === editingAlbumId)) {
      p.albumName = name;
      await dbPut('photos', p);
    }
    closeModal('modal-album');
    showToast('Album updated');
    openAlbum(editingAlbumId);
    document.getElementById('album-detail-title').textContent = name;
  } else {
    await dbAdd('albums', { name, order, created: Date.now() });
    closeModal('modal-album');
    showToast('Album created');
    renderAlbums();
  }
}

async function deleteCurrentAlbum() {
  closeModal('modal-album-options');
  const photos = await dbGetAll('photos');
  for (const p of photos.filter(p => p.albumId === currentAlbumId)) {
    p.albumId = null;
    p.albumName = null;
    await dbPut('photos', p);
  }
  await dbDelete('albums', currentAlbumId);
  showToast('Album deleted');
  showScreen('albums');
}

// ══════════════════════════════════════════
//  UPLOAD
// ══════════════════════════════════════════
async function renderUploadAlbumPicker() {
  const albums = await dbGetAll('albums');
  const sel = document.getElementById('upload-album-select');
  sel.innerHTML = '<option value="">No album</option>' + albums.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  pendingFiles = [];
  document.getElementById('upload-preview').style.display = 'none';
  document.getElementById('upload-preview').innerHTML = '';
  document.getElementById('upload-btn').disabled = true;
}

function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pendingFiles.push(...files);
  renderUploadPreviews();
  e.target.value = '';
}

function renderUploadPreviews() {
  const preview = document.getElementById('upload-preview');
  if (pendingFiles.length === 0) { preview.style.display = 'none'; preview.innerHTML = ''; document.getElementById('upload-btn').disabled = true; return; }
  preview.style.display = 'grid';
  preview.innerHTML = pendingFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="upload-preview-item">
      <img src="${url}" alt="">
      <button class="remove-preview" onclick="removePendingFile(${i})">×</button>
    </div>`;
  }).join('');
  document.getElementById('upload-btn').disabled = false;
}

function removePendingFile(i) {
  pendingFiles.splice(i, 1);
  renderUploadPreviews();
}

async function uploadPhotos() {
  if (!pendingFiles.length) return;
  const albumId = document.getElementById('upload-album-select').value;
  const albumIdNum = albumId ? parseInt(albumId) : null;
  let albumName = null;
  if (albumIdNum) { const a = await dbGet('albums', albumIdNum); albumName = a ? a.name : null; }

  document.getElementById('loading').classList.add('show');

  for (const file of pendingFiles) {
    const dataUrl = await fileToDataUrl(file);
    await dbAdd('photos', {
      name: file.name,
      dataUrl,
      albumId: albumIdNum,
      albumName,
      date: Date.now(),
      size: file.size
    });
  }

  document.getElementById('loading').classList.remove('show');
  showToast(`${pendingFiles.length} photo${pendingFiles.length > 1 ? 's' : ''} saved`);
  pendingFiles = [];
  goBack();
}

function fileToDataUrl(file) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}

// drag & drop
const uploadBox = document.getElementById('upload-box');
uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('drag-over'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('drag-over'));
uploadBox.addEventListener('drop', e => {
  e.preventDefault();
  uploadBox.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  pendingFiles.push(...files);
  renderUploadPreviews();
});

// ══════════════════════════════════════════
//  LIGHTBOX
// ══════════════════════════════════════════
let lightboxInAlbum = false;

async function openLightbox(photoId, inAlbum = false) {
  currentPhotoId = photoId;
  lightboxInAlbum = inAlbum;
  const photo = await dbGet('photos', photoId);
  document.getElementById('lightbox-img').src = photo.dataUrl;
  document.getElementById('lightbox-label').textContent = photo.albumName || '';
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

function openPhotoOptions() {
  openModal('modal-photo-options');
}

async function deleteCurrentPhoto() {
  closeModal('modal-photo-options');
  closeLightbox();
  await dbDelete('photos', currentPhotoId);
  showToast('Photo deleted');
  if (lightboxInAlbum) openAlbum(currentAlbumId);
  else renderPictures();
}

async function movePhotoToAlbum() {
  closeModal('modal-photo-options');
  const albums = await dbGetAll('albums');
  const list = document.getElementById('move-album-list');
  list.innerHTML = `
    <button class="btn-secondary" onclick="doMovePhoto(null)" style="text-align:left;padding:14px 16px;">📷 &nbsp; No album</button>
    ${albums.map(a => `<button class="btn-secondary" onclick="doMovePhoto(${a.id})" style="text-align:left;padding:14px 16px;">📁 &nbsp; ${a.name}</button>`).join('')}
  `;
  openModal('modal-move-album');
}

async function doMovePhoto(albumId) {
  closeModal('modal-move-album');
  const photo = await dbGet('photos', currentPhotoId);
  photo.albumId = albumId;
  if (albumId) { const a = await dbGet('albums', albumId); photo.albumName = a.name; }
  else photo.albumName = null;
  await dbPut('photos', photo);
  closeLightbox();
  showToast('Photo moved');
  renderPictures();
}

// ══════════════════════════════════════════
//  MODAL HELPERS
// ══════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
});

document.getElementById('album-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmAlbum();
});

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
initDB().then(() => {
  showScreen('pictures');
}).catch(err => {
  console.error('DB init failed:', err);
  document.body.innerHTML = '<div style="padding:40px;color:#ff4a4a;font-family:sans-serif;">Failed to initialize storage. Please use Chrome or a modern browser.</div>';
});
</script>
</body>
</html>
